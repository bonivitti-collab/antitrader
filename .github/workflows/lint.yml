name: Quality and security

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: TypeScript, Prettier and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: TypeScript (existing lint command)
        run: bun run lint
      - name: Prettier (CI/CD and tests)
        run: bun run format:check
      - name: Dependency security audit
        run: bun audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3.31.0
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3.31.0
        with:
          category: /language:javascript-typescript
