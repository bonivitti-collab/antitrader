name: Test, build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_PUBLIC_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PUBLIC_URL: ${{ vars.VERCEL_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: "1.4.3"
      - name: Validate configuration before publishing
        run: |
          node --input-type=module <<'NODE'
          const required = [
            'RAILWAY_TOKEN', 'RAILWAY_PROJECT_ID', 'RAILWAY_SERVICE_ID',
            'RAILWAY_ENVIRONMENT_ID', 'RAILWAY_PUBLIC_URL', 'VERCEL_TOKEN',
            'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID', 'VERCEL_PUBLIC_URL',
          ];
          for (const key of required) {
            if (!process.env[key]?.trim()) throw new Error(`Configure ${key} in the production environment`);
          }
          for (const key of ['RAILWAY_PUBLIC_URL', 'VERCEL_PUBLIC_URL']) {
            const url = new URL(process.env[key]);
            if (url.protocol !== 'https:' || url.username || url.password ||
                url.pathname !== '/' || url.search || url.hash) {
              throw new Error(`${key} must be an HTTPS origin without credentials or paths`);
            }
          }
          NODE
      - name: Deploy Railway backend
        run: >-
          npx --yes @railway/cli@5.71.0 up --ci
          --project "$RAILWAY_PROJECT_ID"
          --service "$RAILWAY_SERVICE_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
      - name: Verify public backend
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
            "${RAILWAY_PUBLIC_URL%/}/api/health" |
            jq -e '(.status == "ACTIVE" or .status == "FROZEN") and (.providers | type == "object")'
      - name: Route frontend API requests to Railway
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          config.rewrites[0].destination = `${new URL(process.env.RAILWAY_PUBLIC_URL).origin}/api/$1`;
          fs.writeFileSync('vercel.json', JSON.stringify(config, null, 2));
          fs.appendFileSync('.vercelignore', '\napi/\n');
          NODE
      - name: Pull Vercel production settings
        run: npx --yes vercel@65.0.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel frontend
        run: npx --yes vercel@65.0.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy Vercel frontend
        run: npx --yes vercel@65.0.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify frontend and API proxy
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
            "${VERCEL_PUBLIC_URL%/}/" --output /dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 \
            "${VERCEL_PUBLIC_URL%/}/api/health" |
            jq -e '(.status == "ACTIVE" or .status == "FROZEN") and (.providers | type == "object")'
      - name: Report verified public endpoints
        run: |
          printf '### Deployment checks passed\n- Frontend: %s\n- Backend: %s\n- Commit: `%s`\n' \
            "$VERCEL_PUBLIC_URL" "$RAILWAY_PUBLIC_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
