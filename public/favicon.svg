<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- A-Left Stem Gradient -->
    <linearGradient id="leftStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- A-Right Stem Gradient -->
    <linearGradient id="rightStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Shield Bar / Anti-Crossbar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card / Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Subtle Inner Depth Ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

  <!-- Background Decorative Shield / Tech Matrix Grid (Subtle) -->
  <circle cx="256" cy="240" r="140" fill="#10b981" fill-opacity="0.04" filter="blur(30px)" />

  <!-- MAIN ICON: THE "A" OF ANTITRADER (High-contrast, bold, ultra-legible) -->
  <g transform="translate(0, 8)">
    <!-- Left Leg of 'A' -->
    <polygon points="256,76 210,172 152,388 98,388 226,76" fill="url(#leftStem)" />

    <!-- Right Leg of 'A' -->
    <polygon points="256,76 302,172 360,388 414,388 286,76" fill="url(#rightStem)" />

    <!-- Sharp Top Vertex Cap -->
    <polygon points="256,60 286,76 256,92 226,76" fill="#67e8f9" />

    <!-- The Bold 'Anti-Bar' / Shield Crossbar (Signifying Value Barrier & Safety Margin) -->
    <!-- Distinct, thick, sharp angled bar that pops even at 16x16 px -->
    <polygon points="126,278 386,278 368,326 144,326" fill="url(#barGrad)" />

    <!-- Central Rising Core / Steady Compounding Triangle -->
    <polygon points="256,150 292,234 220,234" fill="#090d16" />
    <polygon points="256,168 282,230 230,230" fill="url(#leftStem)" />

    <!-- Solid Base Foundation Anchors (Anti-Giro / Anti-Trader stability) -->
    <rect x="90" y="380" width="70" height="18" rx="6" fill="#34d399" />
    <rect x="352" y="380" width="70" height="18" rx="6" fill="#22d3ee" />
  </g>
</svg>