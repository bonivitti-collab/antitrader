<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Profundo e moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <!-- Metallic Border Ring Glow -->
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Candlestick 3D Body Gradient (Vela de Trading com volume) -->
    <linearGradient id="candle3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Candlestick Top/Bottom bevel cap -->
    <linearGradient id="candleCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Prohibition Ring Gradient (O Vermelho Escarlate Tecnológico com Profundidade) -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Inner Shadow / Depth Ring -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Base Squircle / App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Gridlines sutis de mercado ao fundo -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.6" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4" />
  <line x1="256" y1="80" x2="256" y2="432" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4" />

  <!-- ============================================================== -->
  <!-- O CANDLESTICK 3D (A "Vela" do Trading que está no centro)       -->
  <!-- ============================================================== -->
  <g filter="url(#subtleShadow)">
    <!-- Pavio Superior (Upper Wick) -->
    <line x1="256" y1="105" x2="256" y2="180" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" />
    <!-- Reflexo do pavio superior -->
    <line x1="255" y1="108" x2="255" y2="175" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Pavio Inferior (Lower Wick) -->
    <line x1="256" y1="332" x2="256" y2="407" stroke="#0284c7" stroke-width="10" stroke-linecap="round" />

    <!-- Corpo 3D do Candle (Body) -->
    <rect x="216" y="176" width="80" height="160" rx="12" fill="url(#candle3D)" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Reflexo de luz especular vertical no corpo do candle para efeito 3D -->
    <rect x="228" y="184" width="12" height="144" rx="6" fill="#ffffff" fill-opacity="0.45" />

    <!-- Borda superior chanfrada do candle (3D cap) -->
    <ellipse cx="256" cy="180" rx="38" ry="8" fill="url(#candleCap)" />
    <!-- Borda inferior do candle -->
    <ellipse cx="256" cy="332" rx="38" ry="8" fill="#0369a1" />
  </g>

  <!-- ============================================================== -->
  <!-- O SÍMBOLO DE PROIBIDO 🚫 (ANTI-TRADING SLASHER EM ALTA DEFINIÇÃO) -->
  <!-- ============================================================== -->
  <g filter="url(#neonGlow)">
    <!-- Anel Circular Externo de Proibição (Thick Prohibitory Ring) -->
    <circle
      cx="256"
      cy="256"
      r="170"
      fill="none"
      stroke="url(#slashGrad)"
      stroke-width="38"
    />

    <!-- Friso de Brilho Interno no Anel -->
    <circle
      cx="256"
      cy="256"
      r="170"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"
      stroke-opacity="0.4"
      stroke-dasharray="140 30"
    />

    <!-- A Barra Diagonal do Proibido (45 graus exatos cortando a vela) -->
    <!-- Cruzando do canto superior esquerdo (x1=135, y1=135) para inferior direito (x2=377, y2=377) -->
    <line
      x1="136"
      y1="136"
      x2="376"
      y2="376"
      stroke="url(#slashGrad)"
      stroke-width="38"
      stroke-linecap="round"
    />

    <!-- Brilho no topo da barra diagonal -->
    <line
      x1="140"
      y1="140"
      x2="372"
      y2="372"
      stroke="#ffffff"
      stroke-width="4"
      stroke-opacity="0.45"
      stroke-linecap="round"
    />
  </g>

  <!-- Ponto de valor/alvo no centro superior (Graham Green Beacon) -->
  <circle cx="256" cy="52" r="6" fill="#10b981" />
  <circle cx="256" cy="52" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5" />
</svg>